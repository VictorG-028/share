[project]
name = "auto-appointment"
version = "0.1.0"
description = "Generate workday appointment punch times (GoF Strategy), decoupled from browser automation."
requires-python = ">=3.12"
dependencies = [
    "prompt-toolkit>=3.0.53",
    "pydantic>=2",
    "websocket-client>=1.9.0",
]

[project.scripts]
auto-appointment = "main:cli"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# `sources = ["src"]` strips the prefix, so main.py, models/ and modules/ land
# at the wheel root -- exactly the layout pytest.ini already assumes, which is
# what keeps the absolute imports (`from models.appointment import ...`)
# working both from a checkout and from an installed wheel.
[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src"]
